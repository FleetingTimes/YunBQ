spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

cors:
  allowed-origins:
    - "https://app.shiyan.online"
    - "https://api.shiyan.online"
  allowed-origin-patterns:
    - "https://*.shiyan.online"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allowed-headers:
    - Authorization
    - Content-Type
  allow-credentials: true
